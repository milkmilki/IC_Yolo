dataset:
  source: data/MIR-WM811K
  output: data/wm811k_cls
  image_size: 224
  ratios: [70, 15, 15]
  include_none: true
  seed: 42
  overwrite: false

prepare:
  enabled: false

model:
  algorithm: yoloctm
  config: null
  weights: yolo26m-cls.pt
  pretrained: true
  ctm:
    d_model: 256
    steps: 4
    dropout: 0.1
    class_weight_power: 0.5

train:
  epochs: 10
  imgsz: 224
  batch: 64
  device: "0"
  workers: 8
  patience: 20
  project: runs/classify
  name: autoresearch_wm811k
  add_timestamp: true
  exist_ok: true

validate:
  enabled: true
  split: val

test:
  enabled: true
  split: test

metrics:
  enabled: true
  splits: [val, test]
  batch: 128

logging:
  filename: pipeline.log

