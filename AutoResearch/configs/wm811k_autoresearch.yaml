dataset:
  source: data/MIR-WM811K
  output: data/wm811k_cls
  image_size: 224
  ratios: [70, 15, 15]
  include_none: true
  seed: 42
  overwrite: false

prepare:
  enabled: false

model:
  algorithm: yoloctm
  config: null
  weights: yolo26m-cls.pt
  pretrained: true
  ctm:
    d_model: 96
    steps: 4
    dropout: 0.1
    class_weight_power: 0.5
    adapter_rank: 0
    feature_adapter: true
    feature_fusion: residual
    gate_rank: 16
    token_gate_rank: 16
    logit_bias: false
    logit_bias_init: zero
    logit_bias_prior_tau: 0.4
    anchor_loss_weight: 0.0
    distill_logprobs: AutoResearch/cache/train_logprob_ensemble_060202_tau0025.npz
    distill_weight: 0.25
    distill_temperature: 2.0
    logprob_fusion: false
    logprob_fusion_init: 0.2
    readout: mean

train:
  epochs: 10
  imgsz: 224
  batch: 64
  device: "0"
  workers: 0
  patience: 20
  project: runs/classify
  name: autoresearch_yoloctm_ensemble_distill_priorcal
  add_timestamp: true
  exist_ok: true

validate:
  enabled: true
  split: val

test:
  enabled: true
  split: test

metrics:
  enabled: true
  splits: [val, test]
  batch: 128
  prior_logit_tau: 0.4

logging:
  filename: pipeline.log
  autoresearch: true
  description: "Single-model CTM residual feature adapter trained with fixed log-probability ensemble distillation (w=0.25,T=2.0) and eval-time class-prior logit calibration tau=0.4"
