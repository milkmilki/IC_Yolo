dataset:
  source: data/MIR-WM811K
  output: data/wm811k_cls
  image_size: 224
  ratios: [70, 15, 15]
  include_none: true
  seed: 42
  overwrite: false

prepare:
  enabled: false

model:
  algorithm: yoloctm
  config: null
  weights: yolo26m-cls.pt
  pretrained: true
  ctm:
    d_model: 96
    steps: 4
    dropout: 0.1
    class_weight_power: 0.5
    adapter_rank: 0
    feature_adapter: true
    feature_fusion: residual
    gate_rank: 16
    token_gate_rank: 16
    logit_bias: false
    logit_bias_init: zero
    logit_bias_prior_tau: 0.4
    anchor_loss_weight: 0.0
    distill_logprobs: null
    distill_weight: 0.0
    distill_temperature: 2.0
    distill_mode: full
    prototype_bcl_weight: 0.0
    prototype_bcl_temperature: 0.1
    classifier_cbr_weight: 0.0
    classifier_cbr_power: 1.0
    classifier_cbr_start_epoch: 1
    loss: weighted_ce
    ldam_max_margin: 0.2
    ldam_start_epoch: 7
    logprob_fusion: false
    logprob_fusion_init: 0.2
    expert_fusion: none
    expert_ctm_init: 0.4
    freeze_yolo_anchor: false
    spatial_encoding: none
    spatial_encoding_scale_init: 0.05
    token_mixer: none
    scan_scale_init: 0.05
    readout: mean

train:
  epochs: 10
  imgsz: 224
  batch: 64
  micro_batch: 16
  selection_prior_logit_tau: 0.4
  ema_decay: 0.9995
  device: "0"
  workers: 0
  sampling: natural
  none_sampling_ratio: 0.75
  sampling_start_epoch: 1
  patience: 20
  project: runs/classify
  name: autoresearch_yoloctm_nodistill_ema9995_tau04_e10
  add_timestamp: true
  exist_ok: true

validate:
  enabled: true
  split: val

test:
  enabled: false
  split: test

metrics:
  enabled: true
  splits: [val]
  batch: 128
  prior_logit_tau: 0.4

logging:
  filename: pipeline.log
  autoresearch: true
  status: auto
  keep_val_macro_f1_min: 0.9028144470534541
  description: "Non-distilled <=10epoch track screening: same no-distill tau=0.4 recipe with slower EMA decay 0.9995, constrained to 10 epochs; no test-set evaluation"
