dataset:
  source: data/MIR-WM811K
  output: data/wm811k_cls
  image_size: 224
  ratios: [70, 15, 15]
  include_none: true
  seed: 42
  overwrite: false

prepare:
  enabled: false

model:
  algorithm: yoloctm
  config: null
  weights: yolo26m-cls.pt
  pretrained: true
  ctm:
    d_model: 96
    steps: 4
    dropout: 0.1
    class_weight_power: 0.5
    adapter_rank: 0
    feature_adapter: true
    logprob_fusion: true
    logprob_fusion_init: 0.2

train:
  epochs: 10
  imgsz: 224
  batch: 64
  device: "0"
  workers: 0
  patience: 20
  project: runs/classify
  name: autoresearch_yoloctm_learned_logprob_fusion
  add_timestamp: true
  exist_ok: true

validate:
  enabled: true
  split: val

test:
  enabled: true
  split: test

metrics:
  enabled: true
  splits: [val, test]
  batch: 128
  prior_logit_tau: 0.0

logging:
  filename: pipeline.log
  autoresearch: true
  description: "Full CTM residual feature adapter with learned in-model log-probability fusion of YOLO and CTM heads; no post-hoc prior calibration"
