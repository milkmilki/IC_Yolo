# Foreground run:
# conda run --no-capture-output -n pcb_yolo python scripts/run_wm811k_pipeline.py --config configs/wm811k_cls.yaml
#
# Background run:
# Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','cd /d E:\Cjn\PCB_Yolo; New-Item -ItemType Directory -Force runs | Out-Null; conda run --no-capture-output -n pcb_yolo python scripts/run_wm811k_pipeline.py --config configs/wm811k_cls.yaml *> runs/wm811k_pipeline.nohup.log'

dataset:
  source: data/MIR-WM811K  # 原始 WM-811K 数据目录；脚本会在这里递归查找 LSWMD.pkl
  output: data/wm811k_cls  # 转换后的 YOLO 分类数据集目录，下面应包含 train/val/test
  image_size: 224  # wafer map 保存为 PNG 时的正方形尺寸，同时通常与训练 imgsz 保持一致
  ratios: [70, 15, 15]  # 数据准备阶段使用的 train/val/test 划分比例，会自动归一化
  include_none: true  # 是否把 normal/none 类加入分类任务；true 表示 9 类，false 表示只做 8 类缺陷分类
  seed: 42  # 数据划分随机种子；保持不变可复现实验划分
  overwrite: true  # 数据准备阶段是否删除并重建 output；仅在 prepare.enabled 为 true 时生效

prepare:
  enabled: false  # 是否重新准备/划分数据集；false 表示直接复用现有 data/wm811k_cls

model:
  algorithm: yoloctm  # 可选：yolo 使用 Ultralytics 分类基线；yoloctm 使用 YOLO backbone + spatial CTM head
  config: null  # 模型结构配置文件，例如 yolo26m-cls.yaml；为 null 时直接从 weights 推断结构
  weights: yolo26m-cls.pt  # 预训练权重文件；algorithm 为 yoloctm 时会作为 YOLO backbone 初始化权重
  pretrained: true  # 是否加载预训练权重；true 适合迁移学习
  ctm:
    d_model: 256  # YoloCTM token/state 隐层维度；仅 algorithm: yoloctm 时使用
    steps: 4  # CTM 迭代更新步数；仅 algorithm: yoloctm 时使用
    dropout: 0.1  # CTM block dropout；仅 algorithm: yoloctm 时使用
    class_weight_power: 0.5  # 类别权重缓和系数；0 表示不加权，1 表示完全按反频率加权

train:
  epochs: 10  # 训练轮数；正式长跑可调大，快速验证可保持较小
  imgsz: 224  # 训练输入图像尺寸，应与 dataset.image_size 一致
  batch: 64  # 每个 batch 的图像数量；显存不足时调小
  device: "0"  # 训练设备；"0" 表示 CUDA 第 0 张 GPU，"cpu" 表示只用 CPU
  workers: 8  # DataLoader 数据加载进程数；Windows 下过高可能增加启动开销
  patience: 20  # 早停耐心轮数；验证指标连续这么多轮无提升时停止
  project: runs/classify  # Ultralytics 输出根目录
  name: wm811k_yolo26m  # 本次实验名称前缀；启用时间戳后会追加 YYYYMMDD_HHMMSS
  add_timestamp: true  # 是否给 run 目录追加时间戳，避免覆盖旧实验
  exist_ok: true  # run 目录已存在时是否允许继续写入

validate:
  enabled: true  # 训练结束后是否执行验证
  split: val  # 验证使用的数据划分名称

test:
  enabled: true  # 训练结束后是否执行测试集评估
  split: test  # 测试使用的数据划分名称

metrics:
  enabled: true  # 是否额外计算 precision/recall/F1 等分类指标
  splits: [val, test]  # 需要生成详细分类报告的数据划分
  batch: 128  # 计算详细指标时的预测 batch size

logging:
  filename: pipeline.log  # pipeline 运行日志文件名，保存在每次 run 目录下
