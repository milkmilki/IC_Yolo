# Foreground run:
# conda run --no-capture-output -n pcb_yolo python scripts/run_wm811k_pipeline.py --config configs/wm811k_cls.yaml
#
# Background run:
# Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','cd /d E:\Cjn\PCB_Yolo; New-Item -ItemType Directory -Force runs | Out-Null; conda run --no-capture-output -n pcb_yolo python scripts/run_wm811k_pipeline.py --config configs/wm811k_cls.yaml *> runs/wm811k_pipeline.nohup.log'

dataset:
  source: data/MIR-WM811K
  output: data/wm811k_cls
  image_size: 224
  ratios: [70, 15, 15]  # train, val, test; normalized automatically
  include_none: false
  seed: 42
  overwrite: true

prepare:
  enabled: false

model:
  name: yolo26m-cls.pt
  pretrained: true

train:
  epochs: 5
  imgsz: 224
  batch: 64
  device: "0"
  workers: 8
  patience: 20
  project: runs/classify
  name: wm811k_yolo26m
  add_timestamp: true
  exist_ok: true

validate:
  enabled: true
  split: val

test:
  enabled: true
  split: test

logging:
  filename: pipeline.log
